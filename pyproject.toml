[project]
name = "agrinet-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "pyarrow>=17",
    "numpy>=2",
    "feedparser>=6",
    "python-dotenv>=1",
    "pyshp>=3.1.7",
    "shapely>=2.2.0",
    "pandas>=3.1.1",
    "networkx>=3.7",
]
[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
[tool.ruff]
line-length = 100
